<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhyberApex</title>
    <meta name="description" content="Software Engineering PMTS at Salesforce | Gamer | Miniature Painter" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="manifest" href="/favicons/site.webmanifest" />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <style>
      .ns-root {
        display: flex;
        justify-content: center;
        padding: 3rem 1.5rem 4rem;
      }
      .ns-card {
        width: 100%;
        max-width: 640px;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 10px;
        padding: 2rem 2rem 2.25rem;
      }
      .ns-name {
        font-family: var(--font-mono);
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--color-text-1);
        margin: 0 0 0.35rem;
      }
      .ns-tagline {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--color-accent);
        margin: 0 0 1.25rem;
      }
      .ns-bio {
        font-family: var(--font-serif);
        font-size: 0.95rem;
        line-height: 1.7;
        color: var(--color-text-2);
        margin: 0 0 1.5rem;
      }
      .ns-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin: 0 0 1.5rem;
      }
      .ns-link {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 0.45rem 1rem;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        color: var(--color-text-2);
      }
      .ns-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 0.6rem;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--color-text-3);
        border-top: 1px solid var(--color-border-subtle);
        padding-top: 1.1rem;
      }
      .ns-nav a {
        color: var(--color-text-3);
      }
      .ns-notice {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--color-text-muted);
        margin: 1.25rem 0 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="ns-root">
        <div class="ns-card">
          <p class="ns-name">Janis Walliser</p>
          <p class="ns-tagline">PMTS Software Engineer @ Salesforce · Security Engineer · Vue.js Developer</p>
          <p class="ns-bio">
            Architects scalable frontends, reviews code for vulnerabilities, and mentors engineers.
            Certified Vue Developer and TypeScript devotee, based in Kaiserslautern, Germany. Off the
            clock: painting miniatures, curating video game soundtracks on vinyl, and losing board
            game sessions on purpose to keep the peace at home.
          </p>
          <div class="ns-links">
            <a class="ns-link" href="mailto:janis@phyberapex.de">Email</a>
            <a class="ns-link" href="https://www.linkedin.com/in/janis-walliser-41687278/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a class="ns-link" href="https://github.com/PhyberApex" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
          <nav class="ns-nav" aria-label="Site navigation">
            <a href="/about">About</a>
            <span aria-hidden="true">·</span>
            <a href="/projects">Projects</a>
            <span aria-hidden="true">·</span>
            <a href="/cv">English CV</a>
            <span aria-hidden="true">·</span>
            <a href="/lebenslauf">Lebenslauf</a>
          </nav>
          <p class="ns-notice">This site is far more interesting with JavaScript enabled.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
